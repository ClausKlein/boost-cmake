---
name: CMake

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # run at 15:30 on day-of-month 7.
    - cron: '30 15 7 * *'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        os: [macos, ubuntu, windows]

    runs-on: ${{ matrix.os }}-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.27.0"
          ninjaVersion: "^1.11.1"

      - name: Setup MSVC
        if: startsWith(matrix.os, 'windows')
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Configure CMake
        run: cmake --preset ${{env.BUILD_TYPE}}

      - name: Build
        # Build your program with the given configuration
        run: cmake --build --preset ${{env.BUILD_TYPE}}

      - name: Install
        # Install the project artefacts to CMAKE_INSTALL_PREFIX
        run: cmake --install ${{github.workspace}}/build/${{env.BUILD_TYPE}} --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build/${{env.BUILD_TYPE}}
        # Execute tests defined by the CMake configuration, but needs to find_package(Boost)!
        run: ctest -C ${{env.BUILD_TYPE}}
